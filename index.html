<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trench Tanks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<h1>Trench <span>Tanks</span></h1>
<div id="app">

  <!-- ONLINE BAR: create a room, share the link, connection status -->
  <section id="onlineBar" class="card" hidden>
    <div class="onlineRow">
      <span id="netStatus" class="netStatus" data-state="local" role="status" aria-live="polite">Local game · both players on this device</span>
      <div class="onlineBtns">
        <button id="reconnectBtn" class="secondary" type="button" hidden>↻ Reconnect</button>
        <button id="leaveBtn" class="secondary" type="button" hidden>Leave</button>
      </div>
    </div>
    <div id="roomBox" class="roomBox" hidden>
      <input id="roomLink" type="text" readonly aria-label="Room link to send to your opponent">
      <button id="copyBtn" class="secondary" type="button">Copy link</button>
    </div>
  </section>

  <!-- SCREEN 0: choose how to play -->
  <section id="modeScreen">
    <div class="modeGrid">
      <button id="modeLocal" class="modeCard" type="button">
        <span class="modeIcon">👥</span>
        <strong>2 players</strong>
        <span class="modeDesc">Take turns on this device</span>
      </button>
      <button id="modeOnline" class="modeCard" type="button">
        <span class="modeIcon">🌐</span>
        <strong>Online game</strong>
        <span class="modeDesc">Send a link to a friend</span>
      </button>
      <div class="modeCard botCard">
        <span class="modeIcon">🤖</span>
        <strong>1 player vs bot</strong>
        <span class="modeDesc">Choose a difficulty</span>
        <div class="levelBtns">
          <button class="secondary" type="button" data-bot="easy">Easy</button>
          <button class="secondary" type="button" data-bot="medium">Medium</button>
          <button class="secondary" type="button" data-bot="hard">Hard</button>
        </div>
      </div>
    </div>
  </section>

  <!-- SCREEN 1: shared weapon pool, players draft one by one -->
  <section id="selectScreen" style="display:none;">
    <div class="card">
      <h2 id="draftPrompt">Player 1, choose your weapon</h2>
      <div id="pickSummary" class="pickSummary"></div>
      <div class="draftBtns">
        <button id="randomBtn" class="secondary" type="button">🎲 Random distribute</button>
        <button class="secondary menuBtn" type="button">← Menu</button>
      </div>
    </div>
    <div id="weaponPool"></div>
    <button id="startBtn" type="button" disabled>Start battle</button>
  </section>

  <!-- SCREEN 2: the match itself, hidden until weapons are chosen -->
  <section id="gameScreen" style="display:none;">
    <div id="stage">
      <canvas id="c"></canvas>
      <div id="banner">
        <div id="bannerText"></div>
        <p id="bannerNote"></p>
        <button id="rematchBtn" class="secondary" type="button">Rematch (same weapons)</button>
        <button id="restartBtn" class="secondary" type="button">Choose weapons again</button>
      </div>
    </div>

    <div class="hud">
      <div class="card" id="p1">
        <h2>Player 1</h2>
        <div class="score" id="scoreP1">0 pts</div>
        <div class="ammo" id="ammoP1"></div>
      </div>
      <div class="card" id="windCard">
        <h2>Wind</h2>
        <div id="windVal" style="font-family:'Space Mono',monospace;font-size:1.1rem;">0</div>
      </div>
      <div class="card" id="p2">
        <h2>Player 2</h2>
        <div class="score" id="scoreP2">0 pts</div>
        <div class="ammo" id="ammoP2"></div>
      </div>
    </div>

    <div class="card" style="margin-top:10px;">
      <h2><span id="turnFlag">Player 1's</span> turn · <span id="shotCount">Shot 1 of 20</span></h2>
      <div class="row">
        <label for="weaponSelect">Weapon</label>
        <select id="weaponSelect"></select>
      </div>
      <div class="row">
        <label for="angle">Angle</label>
        <input type="range" id="angle" min="0" max="180" value="45">
        <span class="val" id="angleVal">45°</span>
      </div>
      <div class="row">
        <label for="power">Power</label>
        <input type="range" id="power" min="10" max="100" value="60">
        <span class="val" id="powerVal">60</span>
      </div>
      <div id="controls">
        <button id="fireBtn" type="button">Fire!</button>
        <button id="newTerrainBtn" class="secondary" type="button">New terrain</button>
        <button class="secondary menuBtn" type="button">← Menu</button>
      </div>
    </div>
    <p id="hint">Arrow keys ↑↓ adjust power, ←→ adjust angle, space fires.</p>
  </section>

  <!-- CHAT: only shown in online games -->
  <section id="chat" class="card" hidden>
    <h2>Chat</h2>
    <div id="chatLog" class="chatLog" aria-live="polite"></div>
    <form id="chatForm" class="chatForm">
      <input id="chatInput" type="text" placeholder="Say something…" autocomplete="off" aria-label="Chat message">
      <button id="chatSend" class="secondary" type="submit">Send</button>
    </form>
  </section>

</div>

<!-- PeerJS: WebRTC helper + free signaling server (version pinned) -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/weapons.js"></script>
<script src="js/deterministic.js"></script>
<script src="js/terrain.js"></script>
<script src="js/bot.js"></script>
<script src="js/game.js"></script>
<script src="js/protocol.js"></script>
<script src="js/net-config.js"></script>
<script src="js/net.js"></script>
<script src="js/online.js"></script>
</body>
</html>
